# configuracao do bd
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = topicos2
quarkus.datasource.password = 123456
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/topicos2db

quarkus.hibernate-orm.database.generation=drop-and-create

# desabilitar o docker 
quarkus.devservices.enabled=false

quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# configuracao do cors
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
# wildcard (*) é incompatível com allow-credentials=true — listar explicitamente
quarkus.http.cors.exposed-headers=Authorization, Content-Disposition, X-Page, X-Page-Size, X-Total-Count
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# armazenamento de objetos S3 compatível (SeaweedFS local, sem Docker)
object-storage.endpoint=${S3_ENDPOINT:http://localhost:8333}
object-storage.region=${S3_REGION:us-east-1}
object-storage.bucket=${S3_BUCKET:car-images}
%dev.object-storage.access-key=${S3_ACCESS_KEY:admin}
%dev.object-storage.secret-key=${S3_SECRET_KEY:secret}
%prod.object-storage.access-key=${S3_ACCESS_KEY}
%prod.object-storage.secret-key=${S3_SECRET_KEY}
object-storage.path-style-access=${S3_PATH_STYLE_ACCESS:true}

# base url para o type em exception
%dev.problem.base-url=http://localhost:8080
# %prod.problem.base-url=https://api.seusistema.com

# Autenticacao OIDC: o login do projeto troca credenciais por tokens no backend.
# O browser recebe apenas cookies HttpOnly; o mecanismo OIDC valida o access token.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180/realms/ecommerce}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:ecommerce-backend}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:}
quarkus.oidc.roles.role-claim-path=realm_access/roles
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
%prod.app.auth.cookie-secure=true

# Conta de servico usada apenas no backend para cadastrar usuarios no Keycloak.
quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL:http://localhost:8180}
quarkus.keycloak.admin-client.realm=${KEYCLOAK_REALM:ecommerce}
quarkus.keycloak.admin-client.client-id=${KEYCLOAK_CLIENT_ID:ecommerce-backend}
quarkus.keycloak.admin-client.client-secret=${KEYCLOAK_CLIENT_SECRET:}
quarkus.keycloak.admin-client.username=
quarkus.keycloak.admin-client.password=
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS
app.frontend-url=${FRONTEND_URL:http://localhost:4200}


# SeaweedFS local é iniciado manualmente por topicos2-backend/start-storage.ps1.

# log detalhado no perfil dev
# %dev.quarkus.log.console.enable=true
# %dev.quarkus.log.console.level=DEBUG
# %dev.quarkus.log.category."br.unitins.tp2".level=DEBUG
# %dev.quarkus.log.category."io.vertx.ext.web".level=DEBUG
