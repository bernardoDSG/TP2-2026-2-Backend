# Os testes usam identidades controladas por @TestSecurity, sem exigir Keycloak externo.
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.credentials.secret=test-only-placeholder
%test.quarkus.keycloak.admin-client.client-secret=test-only-placeholder